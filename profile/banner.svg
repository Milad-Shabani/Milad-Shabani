<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Milad Shabani, Business Intelligence Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1A2B"/>
      <stop offset="60%" stop-color="#12233A"/>
      <stop offset="100%" stop-color="#16283F"/>
    </linearGradient>
    <linearGradient id="bleedgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.58" stop-color="#000000"/>
      <stop offset="0.80" stop-color="#FFFFFF"/>
    </linearGradient>
    <mask id="bleed">
      <rect x="0" y="0" width="1200" height="300" fill="url(#bleedgrad)"/>
    </mask>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="300" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#bg)"/>

    <!-- data motif: a column chart bleeding off the right edge -->
    <g mask="url(#bleed)">
      <rect x="712" y="196" width="26" height="104" fill="#24405F"/>
      <rect x="750" y="168" width="26" height="132" fill="#24405F"/>
      <rect x="788" y="212" width="26" height="88"  fill="#2B4C71"/>
      <rect x="826" y="140" width="26" height="160" fill="#2B4C71"/>
      <rect x="864" y="176" width="26" height="124" fill="#33587F"/>
      <rect x="902" y="108" width="26" height="192" fill="#33587F"/>
      <rect x="940" y="152" width="26" height="148" fill="#3C6690"/>
      <rect x="978" y="84"  width="26" height="216" fill="#E3A64B" opacity="0.55"/>
      <rect x="1016" y="124" width="26" height="176" fill="#3C6690"/>
      <rect x="1054" y="62"  width="26" height="238" fill="#E3A64B" opacity="0.8"/>
      <rect x="1092" y="112" width="26" height="188" fill="#3C6690"/>
      <rect x="1130" y="40"  width="26" height="260" fill="#E3A64B"/>
      <rect x="1168" y="96"  width="26" height="204" fill="#3C6690"/>
      <!-- trend line across the columns -->
      <polyline points="725,196 763,168 801,212 839,140 877,176 915,108 953,152 991,84 1029,124 1067,62 1105,112 1143,40 1181,96"
                fill="none" stroke="#F2F5F9" stroke-opacity="0.35" stroke-width="2"/>
    </g>

    <text x="72" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#F2F5F9">Milad Shabani</text>
    <rect x="74" y="140" width="72" height="3" fill="#E3A64B"/>
    <text x="72" y="182" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#C6D4E4">Business Intelligence Engineer</text>
    <text x="72" y="216" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#8FA3BA">Data warehousing &#183; Power BI &#183; forecasting &#38; optimization</text>

    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#7F93AA">
      <text x="72" y="258">4+ years in industry</text>
      <text x="242" y="258">500M+ record warehouse</text>
      <text x="452" y="258">M.Sc. Industrial Engineering</text>
    </g>
  </g>
</svg>
