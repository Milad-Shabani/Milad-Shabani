name: Profile assets

# Builds the streak card and the contribution snake, light and dark, and
# publishes them to the "output" branch. Nothing is committed to main.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The streak steps run first: they create dist/ as the runner user,
      # and the snake step (a Docker action running as root) writes into it.
      - name: Generate streak card (light)
        uses: DenverCoder1/github-readme-streak-stats@d855de1a23fe45bdda5ffbc28a6d4b80b0f107e1 # v1.8.0
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=FFFFFF&stroke=E4E8EC&ring=E3A64B&fire=E3A64B&currStreakLabel=0E1A2B&sideLabels=4A5A6B&currStreakNum=0E1A2B&sideNums=0E1A2B&dates=8FA3BA&disable_animations=true
          path: dist/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Generate streak card (dark)
        uses: DenverCoder1/github-readme-streak-stats@d855de1a23fe45bdda5ffbc28a6d4b80b0f107e1 # v1.8.0
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=0000&stroke=30363D&ring=E3A64B&fire=E3A64B&currStreakLabel=E3A64B&sideLabels=C9D1D9&currStreakNum=F0F6FC&sideNums=F0F6FC&dates=8B949E&disable_animations=true
          path: dist/streak-dark.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Milad-Shabani
          outputs: |
            dist/snake.svg?color_snake=#E3A64B
            dist/snake-dark.svg?palette=github-dark&color_snake=#E3A64B

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
